StylesPath = .github/styles
MinAlertLevel = warning

Packages = Microsoft

Vocab = WeeWoo

[*.md]
BasedOnStyles = Microsoft

# House style: spaced em-dashes are deliberate.
Microsoft.Dashes = NO
# Domain is acronym-dense (SES, EMV, LGA, CFA); headings legitimately use them.
Microsoft.HeadingAcronyms = NO
# Developer audience: "URL", "e.g.", "backend" are correct vocabulary here.
Microsoft.GeneralURL = NO
Microsoft.Foreign = NO
Microsoft.Avoid = NO
Microsoft.Terms = NO
# Australian English: logical punctuation sits outside quotes; lowercase am/pm.
Microsoft.Quotes = NO
Microsoft.AMPM = NO
# Adverbs like "silently fails" are load-bearing in dev docs.
Microsoft.Adverbs = NO
# Negative numbers in these docs are coordinates; hyphen-minus is correct.
Microsoft.Negative = NO
# House style: hyphenated auto- compounds (auto-sync, auto-enables).
Microsoft.Auto = NO
# Nudges, not gates: visible with --minAlertLevel=suggestion locally.
Microsoft.We = suggestion
Microsoft.FirstPerson = suggestion
Microsoft.Contractions = suggestion
