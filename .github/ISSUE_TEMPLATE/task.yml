name: Task / Feature
description: A builder-ready unit of work. Every section is required — write "none" rather than leaving a section empty.
labels: ["needs-refinement"]
body:
  - type: markdown
    attributes:
      value: |
        This template is the issue contract: the same sections the BA skill emits.
        A visible "none" is information; an absent section is ambiguity.
  - type: textarea
    id: problem
    attributes:
      label: Problem / why now
      description: What is wrong or missing, and why it matters now rather than later.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: The end state in plain language — what exists or behaves differently once this is done.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: "One testable sentence each, in EARS form (When/While/If-then/Where … shall …) or Given/When/Then for user scenarios. End each with its verification tag: [test], [demo], [inspect], or [analyze]. No vague words (quickly, robust, user-friendly, handle, support, TBD …) — state the measurable thing meant."
      placeholder: |
        - When <trigger>, the <part> shall <behaviour>. [test]
        - Given <context>, when <action>, then <observable result>. [demo]
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What this issue deliberately does NOT cover. The builder stops at this line. Write "none" if truly unbounded.
    validations:
      required: true
  - type: textarea
    id: context-pointers
    attributes:
      label: Context pointers
      description: Files, functions, docs, prior PRs/issues, and DECISIONS.md entries a builder needs. Paths clickable from the repo root.
    validations:
      required: true
  - type: textarea
    id: dependencies-risks
    attributes:
      label: Dependencies, assumptions & risks
      description: Blocked-by issues, external prerequisites, assumptions the work rests on, known risks and their mitigations. Write "none" if none.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: "Escape hatch: if the work turns out ~2x the estimate, stop and split the issue instead of pushing on."
      options:
        - S (hours; single sitting)
        - M (a day or two)
        - L (multi-day; consider splitting now)
    validations:
      required: true
