name: claude-review

# Stage 3 of the agentic-issues pipeline: an advisory reviewer.
# It never approves, blocks, or pushes — findings land as comments and the
# human merges. Auth is a subscription OAuth token (CLAUDE_CODE_OAUTH_TOKEN
# repo secret, minted with `claude setup-token`).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    # Docs-only PRs are covered by docs-lint; don't spend reviews on them.
    paths-ignore:
      - "**/*.md"
      - ".github/styles/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".markdownlint-cli2.jsonc"
      - ".vale.ini"
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  auto-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            You are the advisory reviewer for this repository. Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Ground rules:
            - Advisory only: never approve, request changes, push commits, or edit files. Your entire output is comments.
            - The human merges. A finding's severity is expressed in its label, not in gatekeeping.
            - Skip anything the mechanical gates already catch (docs-lint, eslint, check-sync) — do not duplicate linters.
            - Always end by posting the sticky summary comment, even with zero inline findings (a clean PR still gets a verdict). If a tool call is denied, do not retry it — continue with what you have and still post the summary.

            Tools: read the diff with `gh pr diff ${{ github.event.pull_request.number }}` / `gh pr view`; post inline findings with the mcp__github_inline_comment__create_inline_comment tool; write the summary with the mcp__github_comment__update_claude_comment tool.

            Part 1 — code review:
            - Review the diff for correctness, security, edge cases, and consistency with the conventions in CLAUDE.md (cache-buster ?v= + SHELL_CACHE discipline, never editing www/ or android/ build outputs, vanilla-JS global-script architecture).
            - Format EVERY finding as a Conventional Comment: "label (decoration): subject" followed by discussion. Labels: praise, nitpick, suggestion, issue, todo, question, thought, note. Decorations: (blocking) = must fix before merge in your judgment, (non-blocking), (if-minor).
            - Post findings as inline comments on the relevant diff lines where possible; include at least one sincere praise if the diff earns it. Only report findings that survive scrutiny — a short review of real findings beats a long review of maybes.

            Part 2 — issue-contract check:
            - If the PR body or title references an issue (Closes/Fixes/Resolves #N, or a plain #N reference), fetch it with `gh issue view N`.
            - Walk its "Acceptance criteria" section. Each criterion ends with a verification tag: [test], [demo], [inspect], or [analyze].
            - In the sticky summary comment, produce a table: criterion (abbreviated) | tag | verified by this PR? (yes / no / partial) | evidence (the test, the code location, or what is missing).
            - A criterion tagged [test] counts as verified only if the PR contains or updates an automated check for it. [inspect] counts if the diff itself demonstrably satisfies it. [demo]/[analyze] usually cannot be verified from the diff alone — mark them "deferred: verify post-merge" rather than guessing.
            - If the PR references no issue, say so in one line in the summary; do not invent a contract to check.

            End the sticky comment with a one-line verdict: "Advisory review complete — N findings (M blocking-labelled), contract check: X/Y criteria verified."
          claude_args: |
            --model sonnet
            --max-turns 50
            --allowedTools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"

  mention:
    # Author is gated HERE, not just inside claude-code-action, and not in a
    # prompt. This is a PUBLIC repo and the workflow carries id-token: write
    # plus pull-requests/issues: write, so an in-action-only check is not
    # enough: the action's internal write-permission check was bypassed in the
    # wild via the "[bot]"-suffix hole (fixed upstream in claude-code-action
    # v1.0.94; GMO Flatt Security, "Poisoning Claude Code"). An in-prompt check
    # is also prompt-injectable from the very comment it reads. This fail-closed
    # author_association gate mirrors claude-build.yml and the house doctrine in
    # DECISIONS.md D-2026-07-20-1: a comment from anyone outside the trusted set
    # never starts the job at all — no checkout, no action run.
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && contains(github.event.comment.body, '@claude')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Least privilege: an on-demand helper needs to read the PR/issue and
          # git history and post comments — nothing more. No Write/Edit, no
          # unscoped Bash. Mirrors the auto-review job's grant above.
          claude_args: |
            --model sonnet
            --allowedTools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
